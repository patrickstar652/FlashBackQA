services:
  - type: web
    name: flashbackqa-api
    runtime: python
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    buildCommand: pip install -r backend/requirements.txt
    startCommand: gunicorn --chdir backend app:app --bind 0.0.0.0:$PORT --timeout 120
    healthCheckPath: /api/health
    envVars:
      - key: PINECONE_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        value: "*"
      - key: RERANK_MODEL
        value: BAAI/bge-reranker-base
      - key: PINECONE_EMBEDDING_MODEL
        value: llama-text-embed-v2
      - key: PINECONE_EMBEDDING_DIMENSION
        value: "768"
      - key: PYTHON_VERSION
        value: 3.11.13
